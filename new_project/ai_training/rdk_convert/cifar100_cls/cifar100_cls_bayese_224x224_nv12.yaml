model_parameters:
  onnx_model: '/data/cifar100_cls/best.onnx'
  march: 'bayes-e'
  working_dir: '/data/cifar100_cls/work'
  output_model_file_prefix: 'cifar100_cls_yolo11n_224x224_nv12'

input_parameters:
  input_type_rt: 'nv12'
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451

calibration_parameters:
  cal_data_dir: '/data/cifar100_cls/calibration_images'
  cal_data_type: 'float32'
  preprocess: true
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
